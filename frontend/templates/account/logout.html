{% extends "accounts/base_auth.html" %}
{% block title %}Sair{% endblock %}

{% block content %}
<div class="w-full max-w-sm space-y-6 text-center">

  <div>
    <h1 class="text-2xl font-bold text-obsidian">Até logo!</h1>
    <p class="mt-2 text-sm text-smoke">Tem certeza que deseja sair da sua conta?</p>
  </div>

  <div class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm space-y-3">
    <form method="post" action="{% url 'account_logout' %}">
      {% csrf_token %}
      <button type="submit"
              class="w-full rounded-md bg-obsidian py-2.5 text-sm font-bold text-white transition-colors hover:bg-obsidian/80">
        Sair da conta
      </button>
    </form>

    <a href="{% url 'dashboard' %}"
       class="block w-full rounded-md border border-slate-200 py-2.5 text-sm font-semibold text-obsidian transition-colors hover:bg-slate-50">
      Cancelar
    </a>
  </div>

</div>
{% endblock %}
