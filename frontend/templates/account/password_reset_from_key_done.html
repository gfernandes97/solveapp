{% extends "accounts/base_auth.html" %}
{% block title %}Senha alterada{% endblock %}

{% block content %}
<div class="w-full max-w-sm space-y-6">
  <div class="rounded-xl border border-slate-200 bg-white p-8 shadow-sm text-center space-y-4">

    <div class="mx-auto flex h-14 w-14 items-center justify-center rounded-full bg-solve/10">
      <svg class="h-7 w-7 text-solve" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
      </svg>
    </div>

    <div class="space-y-1">
      <h1 class="text-xl font-bold text-obsidian">Senha alterada!</h1>
      <p class="text-sm text-smoke">Sua senha foi redefinida com sucesso. Agora você pode entrar com a nova senha.</p>
    </div>

    <a href="{% url 'account_login' %}"
       class="block w-full rounded-md bg-solve py-2.5 text-sm font-bold text-obsidian transition-colors hover:bg-solve-light">
      Entrar na conta
    </a>
  </div>
</div>
{% endblock %}
