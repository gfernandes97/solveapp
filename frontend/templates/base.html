<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Solve{% endblock %} | Solve — Agora você sabe.</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            obsidian: '#0F172A',
            solve:    { DEFAULT: '#00C97A', dark: '#00A862', light: '#33D48E' },
            signal:   '#2563EB',
            solar:    '#F59E0B',
            cloud:    '#F8FAFC',
            smoke:    '#64748B',
          }
        }
      }
    }
  </script>
  {% block extra_head %}{% endblock %}
</head>
<body class="h-full bg-white text-slate-900 antialiased">
  {% block body %}{% endblock %}
</body>
</html>
